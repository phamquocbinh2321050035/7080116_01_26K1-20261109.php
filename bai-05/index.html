<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form đăng ký nhập học</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <form action="" method="post" target="_blank">
    <h3>Form đăng ký cho sinh viên K71 HUMG nhập học</h3>
    <label for="fullName">Họ tên:</label>
    <br>
    <input type="text" name="fullName" id="fullName" required>
    <br>
    <label for="dob">Ngày tháng năm sinh:</label>
    <br>
    <input type="date" name="dob" id="dob" required>
    <br>
    <label for="location">Nơi ở hiện tại:</label>
    <br>
    <input type="text" name="location" id="location" required>
    <br>
    <label for="hometown">Quê quán:</label>
    <br>
    <input type="text" name="hometown" id="hometown" required>
    <br>
    <label for="email">Email:</label>
    <br>
    <input type="email" name="email" id="email" required>
    <br>
    <label for="phone">Số điện thoại liên hệ:</label>
    <br>
    <input type="number" name="phone" id="phone" required>
    <br>
    <label for="sltFaculty">Khoa:</label>
    <br>
    <select name="sltFaculty" id="sltFaculty">
      <option value="Công nghệ thông tin">Công nghệ thông tin</option>
      <option value="Cơ điện">Cơ điện</option>
      <option value="Dầu khí và năng lượng">Dầu khí và năng lượng</option>
      <option value="Khoa học và Kỹ thuật Địa chất">Khoa học và Kỹ thuật Địa chất</option>
      <option value="Kế toán">Kế toán</option>
      <option value="Quản lý đất đai">Quản lý đất đai</option>
      <option value="Quản trị kinh doanh">Quản trị kinh doanh</option>
      <option value="Tự động hoá">Tự động hoá</option>
      <option value="Công nghệ thông tin">Công nghệ thông tin</option>
      <option value="Công nghệ thông tin">Công nghệ thông tin</option>
    </select>
    <br>
    <label for="class">Lớp:</label>
    <br>
    <input type="text" name="class" id="class" required>
    <br>
    <label>Giới tính:</label>
    <br>
    <input type="radio" name="gioiTinh" id="male" value="male">
    <label for="male">Nam</label>
    <br>
    <input type="radio" name="gioiTinh" id="female" value="female">
    <label for="female">Nữ</label>
    <br>
    <input type="radio" name="gioiTinh" id="khac" value="Khac">
    <label for="khac">Khác</label>
    <br>
    <button>Đăng ký</button>
  </form>
</body>

</html>
