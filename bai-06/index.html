<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9">
        <!-- Trình bày form đăng ký nhập học -->
        <div class="form-container">
          <div class="form-header">
            <h2><i class="bi-person-plus-fill">Đăng ký nhập học</i></h2>
            <p class="text-muted">Năm học 2026-2027</p>
          </div>
          <!-- Form thông báo -->
          <i class="bi-infor-circle-fill text-primary"></i>
          <strong>Lưu ý</strong>Các trường đánh dấu <span class="text-danger">*</span> Là bắt buộc phải nhập
        </div>
        <form action="" id="regForm">
          <h3 class="section-title">Thông tin cá nhân</h3>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label" id="hoTen">Họ và tên</label>
              <input type="text" class="form-control" id="hoTen">
            </div>
            <div class="col-md-6">
              <label class="form-label">Ngày sinh</label>
              <input type="date" class="form-control" id="ngaySinh">
            </div>
          </div>
          <div class="row-mb-3">
            <div class="col-md-4">
              <label class="form-label">Giới tính</label>
              <select class="form-select" id="gioiTinh">
                <option value="male">Nam</option>
                <option value="female">Nữ</option>
                <option value="gay">Đông tính Nam</option>
                <option value="lesbian">Đồng tính nữ</option>
                <option value="unknow" selected>Chưa rõ</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Dân tộc</label>
              <input type="text" class="form-control" id="danToc" list="lstDanToc">
              <datalist id="lstDanToc">
                <option value="Kinh">Kinh</option>
                <option value="Kinh">Thái</option>
                <option value="Kinh">Mường</option>
                <option value="Kinh">Méo</option>
                <option value="Kinh">Tày</option>
              </datalist>
              <div class="col-md-4">
                <label class="form-label">Tôn giáo</label>
                <input type="text" class="form-control" id="tonGiao" value="Không">
              </div>
            </div>
            <div class="row-mb-3">
              <div class="col-md-6">
                <label class="form-label">Số CCCD</label>
                <input type="text" class="form-control" id="iD">
              </div>
              <div class="col-md-6">
                <label class="form-label">Ngày cấp</label>
                <input type="date" class="form-control" id="ngayCap">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Địa chỉ thường trú</label>
              <textarea class="form-control" id="diaChi" row="3"
                placeholder="Số nhà, Ngõ/Ngách, đường, phường/xã, tỉnh/thành phố"></textarea>
            </div>
          </div>
          <!-- Điều khoản -->
          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="daDocDK">
              <label class="form-check-label">Tôi cam kết thông tin trên là chính xác và đông ý với tất cả các điểu
                khoản.
                <a href="#" class="text-decoration-noen">xe điều khoản đăng ký</a>
              </label>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6 text-end">
              <input type="reset" class="btn btn-out-line-secondary" value="Làm lại">
            </div>
            <div class="col-md-6">
              <input type="submit" class="btn btn-primary-btn-submit" value="Gửi đăng ký">
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
